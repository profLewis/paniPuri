<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaniPuri - Interactive Steel Pan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        h1 {
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: linear-gradient(90deg, #C0C0C0, #FFFFFF, #C0C0C0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { color: #999; margin-bottom: 15px; font-size: 14px; }
        .pan-container {
            position: relative;
            width: min(650px, 90vw);
            height: min(650px, 90vw);
        }
        svg { width: 100%; height: 100%; }
        .pan-bowl {
            fill: url(#bowlGradient);
            stroke: #666;
            stroke-width: 0.5;
        }
        .note-shape {
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .note-shape:hover { filter: brightness(1.3) drop-shadow(0 0 3px #FFD700); }
        .note-shape.playing {
            filter: brightness(1.5);
            animation: pulse 0.3s ease-out;
        }
        @keyframes pulse {
            0% { filter: brightness(2) drop-shadow(0 0 10px #FFD700); }
            100% { filter: brightness(1.3); }
        }
        .grove-shape { fill: #1a1a1a; stroke: #333; stroke-width: 0.1; }
        .pan-shape.outer { fill: #c0392b; stroke: #e74c3c; stroke-width: 0.05; }
        .pan-shape.central { fill: #2471a3; stroke: #3498db; stroke-width: 0.05; }
        .pan-shape.inner { fill: #1e8449; stroke: #2ecc71; stroke-width: 0.05; }
        .note-label {
            font-size: 0.9px;
            font-weight: bold;
            fill: white;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 0 0 2px black;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #666;
        }
        .legend-color.outer { background: #c0392b; }
        .legend-color.central { background: #2471a3; }
        .legend-color.inner { background: #1e8449; }
        .now-playing {
            margin-top: 10px;
            font-size: 18px;
            min-height: 30px;
            color: #FFD700;
        }
        .controls {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #ccc;
        }
        .controls input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }
        .controls input[type="range"] {
            width: 80px;
        }
        .info {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
        .mode-btn {
            padding: 6px 16px;
            border: 2px solid #FFD700;
            background: transparent;
            color: #FFD700;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn:hover { background: rgba(255, 215, 0, 0.15); }
        .mode-btn.active {
            background: #FFD700;
            color: #1a1a1a;
        }
        .mode-btns { display: flex; gap: 0; }
        .mode-btns .mode-btn:first-child { border-radius: 20px 0 0 20px; border-right-width: 1px; }
        .mode-btns .mode-btn:last-child { border-radius: 0 20px 20px 0; border-left-width: 1px; }
        .sample-status {
            font-size: 11px;
            color: #888;
            min-height: 16px;
        }
    </style>
</head>
<body>
    <h1>PaniPuri</h1>
    <p class="subtitle">Interactive Steel Pan</p>

    <div class="controls">
        <div class="mode-btns">
            <button class="mode-btn" id="btnSynth" onclick="setAudioMode('synth')">Synth</button>
            <button class="mode-btn active" id="btnSamples" onclick="setAudioMode('samples')">Samples</button>
        </div>
        <label>
            <input type="checkbox" id="clickMode" onchange="toggleMode()">
            Click mode
        </label>
        <label>
            Volume
            <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="updateVolume()">
        </label>
    </div>
    <div class="sample-status" id="sampleStatus"></div>

    <div class="pan-container">
        <svg viewBox="-20 -20 40 40" id="panSvg">
            <defs>
                <radialGradient id="bowlGradient" cx="30%" cy="30%">
                    <stop offset="0%" stop-color="#4a4a4a"/>
                    <stop offset="50%" stop-color="#2a2a2a"/>
                    <stop offset="100%" stop-color="#1a1a1a"/>
                </radialGradient>
            </defs>
            <circle class="pan-bowl" cx="0" cy="0" r="19.0"/>
        </svg>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-color outer"></div><span>Outer Ring - 4ths (Octave 4)</span></div>
        <div class="legend-item"><div class="legend-color central"></div><span>Central Ring - 5ths (Octave 5)</span></div>
        <div class="legend-item"><div class="legend-color inner"></div><span>Inner Ring - 6ths (Octave 6)</span></div>
    </div>

    <div class="now-playing" id="nowPlaying">Hover over a note to play</div>

    <p class="info">Tones calibrated from urbanPan Double Seconds recordings</p>

      "harmonic4": 1,
      "filter": 2253,
      "brightness": 92
    },
    "83": {
      "freq": 980.0,
      "attack": 4,
      "decay": 947,
      "sustain": 0,
      "release": 1487,
      "sub_bass": 14,
      "fundamental": 100,
      "harmonic2": 37,
      "harmonic3": 3,
      "harmonic4": 0,
      "filter": 2250,
      "brightness": 89
    },
    "84": {
      "freq": 1002.3,
      "attack": 4,
      "decay": 1137,
      "sustain": 1,
      "release": 1495,
      "sub_bass": 13,
      "fundamental": 100,
      "harmonic2": 4,
      "harmonic3": 0,
      "harmonic4": 0,
      "filter": 5675,
      "brightness": 96
    }
  },
  "defaults": {
    "attack": 17,
    "decay": 1177,
    "sustain": 0,
    "release": 1432,
    "sub_bass": 4,
    "fundamental": 100,
    "harmonic2": 58,
    "harmonic3": 5,
    "harmonic4": 24,
    "filter": 3683,
    "brightness": 99,
    "detune": 2
  }
};

        // Note name to semitone mapping
        const NOTE_TO_SEMITONE = {
            'C': 0, 'C#': 1, 'Db': 1,
            'D': 2, 'D#': 3, 'Eb': 3,
            'E': 4,
            'F': 5, 'F#': 6, 'Gb': 6,
            'G': 7, 'G#': 8, 'Ab': 8,
            'A': 9, 'A#': 10, 'Bb': 10,
            'B': 11
        };

        // Map note names to sounds/ filename format (sharps use lowercase 's')
        const NAME_TO_SAMPLE = {
            'C': 'C', 'C#': 'Cs', 'Db': 'Cs',
            'D': 'D', 'D#': 'Ds', 'Eb': 'Ds',
            'E': 'E',
            'F': 'F', 'F#': 'Fs', 'Gb': 'Fs',
            'G': 'G', 'G#': 'Gs', 'Ab': 'Gs',
            'A': 'A', 'A#': 'As', 'Bb': 'As',
            'B': 'B'
        };

        function noteToMidi(name, octave) {
            const semi = NOTE_TO_SEMITONE[name];
            if (semi === undefined) return null;
            return (octave + 1) * 12 + semi;
        }

        function midiToFreq(midi) {
            return 440.0 * Math.pow(2, (midi - 69) / 12);
        }

        function getCalParams(midi) {
            const key = String(midi);
            if (calibration.notes[key]) {
                return { ...calibration.defaults, ...calibration.notes[key] };
            }
            const keys = Object.keys(calibration.notes).map(Number).sort((a, b) => a - b);
            const below = keys.filter(k => k < midi);
            const above = keys.filter(k => k > midi);
            if (below.length && above.length) {
                const lo = below[below.length - 1];
                const hi = above[0];
                const t = (midi - lo) / (hi - lo);
                const loP = calibration.notes[String(lo)];
                const hiP = calibration.notes[String(hi)];
                const result = { ...calibration.defaults };
                for (const k of ['attack','decay','sustain','release','sub_bass','fundamental','harmonic2','harmonic3','harmonic4','filter','brightness']) {
                    const lv = loP[k] !== undefined ? loP[k] : calibration.defaults[k];
                    const hv = hiP[k] !== undefined ? hiP[k] : calibration.defaults[k];
                    result[k] = Math.round(lv + t * (hv - lv));
                }
                return result;
            }
            if (below.length) return { ...calibration.defaults, ...calibration.notes[String(below[below.length-1])] };
            if (above.length) return { ...calibration.defaults, ...calibration.notes[String(above[0])] };
            return { ...calibration.defaults };
        }

        // ---------------------------------------------------------------
        // Audio state
        // ---------------------------------------------------------------
        let audioCtx = null;
        let masterGain = null;
        let activeNodes = [];
        let clickMode = false;
        let volume = 0.35;
        let audioMode = 'samples'; // default to samples

        // Sample cache: stores either Audio elements (direct) or
        // { buffer: AudioBuffer, shifted: true } for octave-shifted notes
        const sampleCache = {};
        let samplesLoaded = false;
        let samplesLoading = false;
        const MAX_POLYPHONY = 16;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = volume;
            masterGain.connect(audioCtx.destination);
        }

        function updateVolume() {
            volume = document.getElementById('volumeSlider').value / 100 * 0.7;
            if (masterGain) masterGain.gain.value = volume;
        }

        // ---------------------------------------------------------------
        // Audio mode toggle
        // ---------------------------------------------------------------
        function setAudioMode(mode) {
            audioMode = mode;
            document.getElementById('btnSynth').classList.toggle('active', mode === 'synth');
            document.getElementById('btnSamples').classList.toggle('active', mode === 'samples');

            if (mode === 'samples' && !samplesLoaded && !samplesLoading) {
                loadSamples();
            }

            const status = document.getElementById('sampleStatus');
            if (mode === 'synth') {
                status.textContent = '';
            } else if (samplesLoaded) {
                updateSampleStatusFinal();
            }
        }

        // ---------------------------------------------------------------
        // Sample loading with octave-shift fallback
        // ---------------------------------------------------------------

        function getSamplePath(name, octave) {
            const sampleName = NAME_TO_SAMPLE[name];
            if (!sampleName) return null;
            return 'sounds/' + sampleName + octave + '.wav';
        }

        let loadStats = { direct: 0, shifted: 0, synth: 0 };

        function updateSampleStatusFinal() {
            const s = loadStats;
            const parts = [];
            if (s.direct) parts.push(s.direct + ' sampled');
            if (s.shifted) parts.push(s.shifted + ' octave-shifted');
            if (s.synth) parts.push(s.synth + ' synthesized');
            document.getElementById('sampleStatus').textContent = parts.join(', ');
        }

        function loadSamples() {
            if (samplesLoading || samplesLoaded) return;
            samplesLoading = true;
            initAudio();

            const status = document.getElementById('sampleStatus');
            let done = 0;
            const total = noteShapes.length;
            loadStats = { direct: 0, shifted: 0, synth: 0 };

            status.textContent = 'Loading samples... 0/' + total;

            noteShapes.forEach(note => {
                const key = note.name + note.octave;
                const directPath = getSamplePath(note.name, note.octave);
                const shiftPath = getSamplePath(note.name, note.octave - 1);

                // Try direct sample first
                tryLoadAudio(directPath).then(audio => {
                    sampleCache[key] = { type: 'audio', audio };
                    loadStats.direct++;
                    finish();
                }).catch(() => {
                    // Direct failed - try octave below as AudioBuffer for pitch shift
                    if (shiftPath) {
                        tryLoadBuffer(shiftPath).then(buffer => {
                            sampleCache[key] = { type: 'buffer', buffer, rate: 2.0 };
                            loadStats.shifted++;
                            finish();
                        }).catch(() => {
                            // Both failed - will fall back to synth at play time
                            sampleCache[key] = { type: 'synth' };
                            loadStats.synth++;
                            finish();
                        });
                    } else {
                        sampleCache[key] = { type: 'synth' };
                        loadStats.synth++;
                        finish();
                    }
                });

                function finish() {
                    done++;
                    status.textContent = 'Loading samples... ' + done + '/' + total;
                    if (done >= total) {
                        samplesLoaded = true;
                        samplesLoading = false;
                        updateSampleStatusFinal();
                    }
                }
            });
        }

        // Load as HTML Audio element (for direct playback)
        function tryLoadAudio(path) {
            return new Promise((resolve, reject) => {
                if (!path) { reject(); return; }
                const audio = new Audio();
                audio.src = path;
                audio.preload = 'auto';
                audio.addEventListener('canplaythrough', () => resolve(audio), { once: true });
                audio.addEventListener('error', () => reject(), { once: true });
            });
        }

        // Load as AudioBuffer (for pitch-shifted playback)
        function tryLoadBuffer(path) {
            return new Promise((resolve, reject) => {
                if (!path) { reject(); return; }
                fetch(path)
                    .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
                    .then(data => audioCtx.decodeAudioData(data))
                    .then(buffer => resolve(buffer))
                    .catch(() => reject());
            });
        }

        // ---------------------------------------------------------------
        // Sample playback
        // ---------------------------------------------------------------

        let activeSampleVoices = []; // track active sample playbacks for polyphony

        function cleanupSampleVoices() {
            activeSampleVoices = activeSampleVoices.filter(v => !v.ended);
        }

        function playSampleNote(name, octave) {
            const key = name + octave;
            const entry = sampleCache[key];

            if (!entry || entry.type === 'synth') {
                playSynthNote(name, octave);
                return;
            }

            cleanupSampleVoices();

            // Steal oldest voice if at polyphony limit
            if (activeSampleVoices.length >= MAX_POLYPHONY) {
                const oldest = activeSampleVoices.shift();
                if (oldest.type === 'audio') {
                    oldest.audio.pause();
                    oldest.audio.currentTime = 0;
                } else if (oldest.source) {
                    try { oldest.source.stop(); } catch(e) {}
                }
            }

            const vol = document.getElementById('volumeSlider').value / 100;

            if (entry.type === 'audio') {
                // Clone the audio element so multiple can play simultaneously
                const audio = entry.audio.cloneNode();
                audio.volume = vol;
                const voice = { type: 'audio', audio, ended: false };
                audio.onended = () => { voice.ended = true; };
                audio.play().catch(e => console.warn('Playback failed:', e));
                activeSampleVoices.push(voice);

            } else if (entry.type === 'buffer') {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const source = audioCtx.createBufferSource();
                source.buffer = entry.buffer;
                source.playbackRate.value = entry.rate;

                const gain = audioCtx.createGain();
                gain.gain.value = vol;
                source.connect(gain);
                gain.connect(audioCtx.destination);

                const voice = { type: 'buffer', source, ended: false };
                source.onended = () => { voice.ended = true; };
                source.start();
                activeSampleVoices.push(voice);
            }
        }

        // ---------------------------------------------------------------
        // Synth playback
        // ---------------------------------------------------------------
        function playSynthNote(name, octave) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // Clean up finished synth notes
            activeNodes = activeNodes.filter(nodes => {
                try {
                    // Check if all oscillators have ended by checking the scheduled stop time
                    return nodes.endTime > audioCtx.currentTime;
                } catch(e) { return false; }
            });

            // Steal oldest voice if at polyphony limit
            if (activeNodes.length >= MAX_POLYPHONY) {
                const oldest = activeNodes.shift();
                try {
                    oldest.gain.gain.setValueAtTime(oldest.gain.gain.value, audioCtx.currentTime);
                    oldest.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.02);
                    setTimeout(() => {
                        oldest.oscillators.forEach(o => { try { o.stop(); } catch(e) {} });
                    }, 50);
                } catch(e) {}
            }

            const midi = noteToMidi(name, octave);
            if (midi === null) return;

            const freq = midiToFreq(midi);
            const params = getCalParams(midi);

            const now = audioCtx.currentTime;
            const attackTime = params.attack / 1000;
            const decayTime = params.decay / 1000;
            const sustainLevel = params.sustain / 100;
            const releaseTime = Math.min(params.release / 1000, 2.0);
            const duration = 2.0;
            const detune = (params.detune || 2);

            const noteGain = audioCtx.createGain();
            noteGain.gain.setValueAtTime(0, now);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = Math.min(params.filter || 6000, audioCtx.sampleRate / 2 - 100);
            filter.Q.value = 0.7;

            noteGain.connect(filter);
            filter.connect(masterGain);

            const oscillators = [];
            const partials = [
                { ratio: 0.5, ampKey: 'sub_bass', decayMult: 1.0 },
                { ratio: 1.0 - detune/1000, amp: (params.fundamental || 100) / 100 * 0.1, decayMult: 1.0 },
                { ratio: 1.0, ampKey: 'fundamental', decayMult: 1.0 },
                { ratio: 1.0 + detune/1000, amp: (params.fundamental || 100) / 100 * 0.1, decayMult: 1.0 },
                { ratio: 2.0, ampKey: 'harmonic2', decayMult: 1.3 },
                { ratio: 3.0, ampKey: 'harmonic3', decayMult: 1.8 },
                { ratio: 4.0, ampKey: 'harmonic4', decayMult: 2.2 },
            ];

            for (const p of partials) {
                const amp = p.amp !== undefined ? p.amp : (params[p.ampKey] || 0) / 100;
                if (amp < 0.01) continue;

                const f = freq * p.ratio;
                if (f < 30 || f > audioCtx.sampleRate / 2 - 500) continue;

                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = f;

                const partialGain = audioCtx.createGain();
                partialGain.gain.setValueAtTime(0, now);

                const partialDecay = decayTime / p.decayMult;
                const endSustain = sustainLevel * Math.exp(-duration / (partialDecay * 2));

                partialGain.gain.linearRampToValueAtTime(amp, now + attackTime);
                partialGain.gain.linearRampToValueAtTime(amp * sustainLevel, now + attackTime + partialDecay);
                partialGain.gain.exponentialRampToValueAtTime(
                    Math.max(amp * endSustain, 0.0001),
                    now + duration
                );
                partialGain.gain.linearRampToValueAtTime(0, now + duration + releaseTime);

                osc.connect(partialGain);
                partialGain.connect(noteGain);
                osc.start(now);
                osc.stop(now + duration + releaseTime + 0.1);
                oscillators.push(osc);
            }

            noteGain.gain.linearRampToValueAtTime(0.8, now + attackTime);
            noteGain.gain.linearRampToValueAtTime(0.8, now + duration);
            noteGain.gain.linearRampToValueAtTime(0, now + duration + releaseTime);

            activeNodes.push({ gain: noteGain, oscillators, endTime: now + duration + releaseTime + 0.1 });
        }

        // ---------------------------------------------------------------
        // Unified playNote dispatcher
        // ---------------------------------------------------------------
        function playNote(idx, name, octave, element) {
            if (audioMode === 'samples') {
                if (!samplesLoaded && !samplesLoading) loadSamples();
                playSampleNote(name, octave);
            } else {
                playSynthNote(name, octave);
            }

            document.querySelectorAll('.note-shape').forEach(el => el.classList.remove('playing'));
            if (element) element.classList.add('playing');
            document.getElementById('nowPlaying').textContent = name + octave + ' (' + idx + ')';
        }

        // ---------------------------------------------------------------
        // Interaction
        // ---------------------------------------------------------------
        function toggleMode() {
            clickMode = document.getElementById('clickMode').checked;
            renderNotes();
        }

        function renderNotes() {
            const svg = document.getElementById('panSvg');
            svg.querySelectorAll('.note-shape').forEach(el => el.remove());

            noteShapes.forEach(note => {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.classList.add('note-shape');

                if (clickMode) {
                    g.onclick = () => playNote(note.idx, note.name, note.octave, g);
                } else {
                    g.onmouseenter = () => playNote(note.idx, note.name, note.octave, g);
                }

                if (note.grove_path.length > 2) {
                    const grove = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    grove.classList.add('grove-shape');
                    grove.setAttribute('points', note.grove_path.map(p => p.join(',')).join(' '));
                    g.appendChild(grove);
                }

                if (note.pan_path.length > 2) {
                    const pan = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    pan.classList.add('pan-shape', note.ring);
                    pan.setAttribute('points', note.pan_path.map(p => p.join(',')).join(' '));
                    g.appendChild(pan);
                }

                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.classList.add('note-label');
                label.setAttribute('x', note.centroid[0]);
                label.setAttribute('y', note.centroid[1] + 0.3);
                label.textContent = note.name;
                g.appendChild(label);

                svg.appendChild(g);
            });
        }

        // Initialize
        renderNotes();
        // Auto-start loading samples since it is the default mode
        loadSamples();
    </script>
</body>
</html>
